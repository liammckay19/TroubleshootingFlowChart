<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AV CAD Visual Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <script src="data.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; background-color: #f4f4f4; }
        .container { display: flex; flex: 1; gap: 20px; min-height: 0; }
        .panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .controls { width: 350px; }
        .preview { flex: 1; position: relative; }
        #cy { width: 100%; height: 100%; border: 1px solid #ccc; border-radius: 4px; background: #fafafa; }
        h2 { margin-top: 0; font-size: 18px; color: #333; border-bottom: 2px solid #0074D9; padding-bottom: 5px; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 12px; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { margin-top: 10px; padding: 10px; background: #0074D9; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; }
        button:hover { background: #0056a3; }
        textarea { width: 100%; flex: 1; margin-top: 10px; font-family: monospace; padding: 10px; box-sizing: border-box; font-size: 11px; border: 1px solid #ddd; }
        .status-bar { background: #333; color: #fff; padding: 10px; font-size: 13px; border-radius: 4px; margin-bottom: 10px; }
        .highlight { color: #00D1B2; font-weight: bold; }
    </style>
</head>
<body>

    <div class="status-bar" id="statusBar">
        Mode: <span class="highlight">Visual Join</span> - Click a SOURCE node, then a TARGET node to connect them.
    </div>

    <div class="container">
        <div class="panel controls">
            <h2>Add Device</h2>
            <input type="text" id="nodeId" placeholder="ID (e.g. mic1)">
            <input type="text" id="nodeLabel" placeholder="Label (e.g. Mic 1)">
            <input type="text" id="nodeDetails" placeholder="Details (Rack, IP...)">
            <button onclick="addNode()">Add Device</button>

            <h2 style="margin-top:20px;">Current data.js</h2>
            <textarea id="outputCode"></textarea>
            <button onclick="copyCode()" style="background:#2ECC40;">Copy Updated Code</button>
            <button onclick="location.reload()" style="background:#888;">Reset View</button>
        </div>

        <div class="panel preview">
            <h2>Visual Signal Path Joiner</h2>
            <div id="cy"></div>
        </div>
    </div>

    <script>
        // Load existing data from data.js
        let myElements = typeof avElements !== 'undefined' ? JSON.parse(JSON.stringify(avElements)) : [];
        let firstClickedNode = null;

        const cy = cytoscape({
            container: document.getElementById('cy'),
            elements: myElements,
            style: [
                { selector: 'node', style: { 'background-color': '#0074D9', 'label': 'data(label)', 'text-valign': 'bottom', 'text-margin-y': 5, 'font-size': '10px' } },
                { selector: 'edge', style: { 'width': 2, 'line-color': '#ccc', 'target-arrow-shape': 'triangle', 'curve-style': 'bezier' } },
                { selector: '.selected', style: { 'background-color': '#FF4136', 'border-width': 4, 'border-color': '#FF851B' } }
            ],
            layout: { name: 'cose', padding: 30 }
        });

        function updateOutput() {
            const outputArea = document.getElementById('outputCode');
            const cleanElements = cy.elements().map(ele => {
                return { data: ele.data() };
            });
            outputArea.value = `const avElements = ${JSON.stringify(cleanElements, null, 2)};`;
        }

        function addNode() {
            const id = document.getElementById('nodeId').value.trim();
            const label = document.getElementById('nodeLabel').value.trim();
            const details = document.getElementById('nodeDetails').value.trim();

            if(!id || !label) return alert("ID and Label are required");

            const newNode = { data: { id, label, details } };
            cy.add(newNode);
            cy.layout({ name: 'cose' }).run();
            updateOutput();

            document.getElementById('nodeId').value = '';
            document.getElementById('nodeLabel').value = '';
            document.getElementById('nodeDetails').value = '';
        }

        // VISUAL JOIN LOGIC
        cy.on('tap', 'node', function(evt) {
            const node = evt.target;

            if (!firstClickedNode) {
                // First click: Selection
                firstClickedNode = node;
                node.addClass('selected');
                document.getElementById('statusBar').innerHTML = `Source: <span class="highlight">${node.data('label')}</span> - Now click the TARGET device.`;
            } else {
                // Second click: Join
                const source = firstClickedNode.id();
                const target = node.id();

                if (source !== target) {
                    const edgeId = `e_${source}_${target}_${Math.floor(Math.random()*1000)}`;
                    cy.add({ data: { id: edgeId, source: source, target: target } });
                    updateOutput();
                }

                // Reset selection
                firstClickedNode.removeClass('selected');
                firstClickedNode = null;
                document.getElementById('statusBar').innerHTML = `Mode: <span class="highlight">Visual Join</span> - Click a SOURCE node, then a TARGET node to connect them.`;
            }
        });

        function copyCode() {
            const outputArea = document.getElementById('outputCode');
            outputArea.select();
            document.execCommand('copy');
            alert("Updated data.js copied to clipboard!");
        }

        // Initialize textarea on load
        updateOutput();
    </script>
</body>
</html>
